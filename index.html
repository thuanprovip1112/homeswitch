<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Light Switch</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80'>💡</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #121212; color: white; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 320px; text-align: center; }
        .control-group { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 10px; }
        .status { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .btn { width: 100%; padding: 12px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; }
        .label { color: #aaa; font-size: 0.9rem; margin-bottom: 5px; display: block; }
        .schedule-group { margin-top: 20px; padding: 15px; border: 1px solid #444; border-radius: 10px; background: #252525; }
        .schedule-title { color: #4caf50; font-weight: bold; margin-bottom: 10px; }
        .time-input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #333; border-radius: 5px; background: #1a1a1a; color: white; font-size: 0.9rem; }
        .btn-schedule { width: 100%; padding: 10px; margin: 8px 0; font-size: 0.9rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background-color: #2196F3; color: white; }
        .btn-schedule:hover { background-color: #1976D2; }
        .schedule-list { margin-top: 10px; text-align: left; font-size: 0.85rem; }
        .schedule-item { padding: 8px; margin: 5px 0; background: #1a1a1a; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #f44336; padding: 4px 8px; border: none; border-radius: 3px; color: white; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="card">
    <h2>Home Light Switch</h2>
    <p id="systemStatus" style="color: #4caf50;">● Đang kiểm tra...</p>

    <div class="control-group">
        <span class="label"><i class="fas fa-lightbulb"></i> Main Light</span>
        <div id="statusPin2" class="status">Đang tải...</div>
        <button id="btnPin2" class="btn">Đang đợi...</button>
    </div>

    <div class="control-group">
        <span class="label"><i class="fas fa-lightbulb"></i> Bacolny Light</span>
        <div id="statusPin3" class="status">Đang tải...</div>
        <button id="btnPin3" class="btn">Đang đợi...</button>
    </div>

    <div class="control-group">
        <span class="label"><i class="fas fa-water"></i> Bơm Nước (PIN 10)</span>
        <div id="statusPin10" class="status">Đang tải...</div>
        <button id="btnPin10" class="btn">Đang đợi...</button>
    </div>

    <div class="schedule-group">
        <div class="schedule-title"><i class="fas fa-clock"></i> Hẹn Giờ Bật/Tắt</div>
        <select id="scheduleDevice" class="time-input">
            <option value="pin2">Main Light</option>
            <option value="pin3">Bacolny Light</option>
            <option value="pin10">Bơm Nước</option>
        </select>
        <input type="time" id="scheduleTime" class="time-input" placeholder="Nhập giờ hẹn">
        <select id="scheduleAction" class="time-input">
            <option value="on">Bật</option>
            <option value="off">Tắt</option>
        </select>
        <button id="btnAddSchedule" class="btn-schedule">Thêm Hẹn Giờ</button>
        <div id="scheduleList" class="schedule-list"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Cấu hình của bạn
    const firebaseConfig = {
        apiKey: "AIzaSyAnUXN6KPgZiRrNs4BGmWA6MRS6uejCuAs",
        authDomain: "enose-riwqcm.firebaseapp.com",
        databaseURL: "https://enose-riwqcm-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "enose-riwqcm",
        storageBucket: "enose-riwqcm.firebasestorage.app",
        messagingSenderId: "901661079604",
        appId: "1:901661079604:web:8e3aa428380b9aa7133261"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- CHECK STATUS ONLINE/OFFLINE ---
    const systemStatus = document.getElementById('systemStatus');
    const TIMEOUT = 60; // 60 giây
    let lastActive = 0;

    // Lắng nghe last_active từ database
    onValue(ref(db, 'control/last_active'), (snapshot) => {
        lastActive = snapshot.val();
        updateSystemStatus();
    });

    // Function check online/offline
    function updateSystemStatus() {
        const now = Math.floor(Date.now() / 1000);
        const timeDiff = now - lastActive;
        
        if (timeDiff < TIMEOUT) {
            systemStatus.innerText = "● System Online";
            systemStatus.style.color = "#4caf50";
        } else {
            systemStatus.innerText = "● System Offline";
            systemStatus.style.color = "#ff9800";
        }
    }

    // Poll mỗi 5 giây để check status
    setInterval(updateSystemStatus, 5000);

    // --- XỬ LÝ PIN 2 ---
    const statusPin2 = document.getElementById('statusPin2');
    const btnPin2 = document.getElementById('btnPin2');
    let statePin2 = 0; // Lưu trạng thái hiện tại

    onValue(ref(db, 'control/pin2'), (snapshot) => {
        statePin2 = snapshot.val();
        statusPin2.innerText = statePin2 === 1 ? "ĐANG BẬT" : "ĐANG TẮT";
        statusPin2.style.color = statePin2 === 1 ? "#4caf50" : "#f44336";
        btnPin2.innerText = statePin2 === 1 ? "TẮT PIN 2" : "BẬT PIN 2";
        btnPin2.className = statePin2 === 1 ? "btn btn-off" : "btn btn-on";
    });

    btnPin2.onclick = () => {
        const newState = statePin2 === 1 ? 0 : 1;
        update(ref(db, 'control'), { pin2: newState });
    };

    // --- XỬ LÝ PIN 3 ---
    const statusPin3 = document.getElementById('statusPin3');
    const btnPin3 = document.getElementById('btnPin3');
    let statePin3 = 0;

    onValue(ref(db, 'control/pin3'), (snapshot) => {
        statePin3 = snapshot.val();
        statusPin3.innerText = statePin3 === 1 ? "ĐANG BẬT" : "ĐANG TẮT";
        statusPin3.style.color = statePin3 === 1 ? "#4caf50" : "#f44336";
        btnPin3.innerText = statePin3 === 1 ? "TẮT PIN 3" : "BẬT PIN 3";
        btnPin3.className = statePin3 === 1 ? "btn btn-off" : "btn btn-on";
    });

    btnPin3.onclick = () => {
        const newState = statePin3 === 1 ? 0 : 1;
        update(ref(db, 'control'), { pin3: newState });
    };

    // --- XỬ LÝ PIN 10 ---
    const statusPin10 = document.getElementById('statusPin10');
    const btnPin10 = document.getElementById('btnPin10');
    let statePin10 = 0;

    onValue(ref(db, 'control/pin10'), (snapshot) => {
        statePin10 = snapshot.val();
        statusPin10.innerText = statePin10 === 1 ? "ĐANG BẬT" : "ĐANG TẮT";
        statusPin10.style.color = statePin10 === 1 ? "#4caf50" : "#f44336";
        btnPin10.innerText = statePin10 === 1 ? "TẮT BƠM" : "BẬT BƠM";
        btnPin10.className = statePin10 === 1 ? "btn btn-off" : "btn btn-on";
    });

    btnPin10.onclick = () => {
        const newState = statePin10 === 1 ? 0 : 1;
        update(ref(db, 'control'), { pin10: newState });
    };

    // --- HẸN GIỜ BẬT/TẮT ---
    let schedules = JSON.parse(localStorage.getItem('deviceSchedules')) || [];
    const scheduleDeviceSelect = document.getElementById('scheduleDevice');
    const scheduleTimeInput = document.getElementById('scheduleTime');
    const scheduleActionSelect = document.getElementById('scheduleAction');
    const btnAddSchedule = document.getElementById('btnAddSchedule');
    const scheduleList = document.getElementById('scheduleList');

    const deviceNames = {
        'pin2': 'Main Light',
        'pin3': 'Bacolny Light',
        'pin10': 'Bơm Nước'
    };

    function renderSchedules() {
        scheduleList.innerHTML = '';
        schedules.forEach((schedule, index) => {
            const div = document.createElement('div');
            div.className = 'schedule-item';
            const actionText = schedule.action === 'on' ? 'Bật' : 'Tắt';
            div.innerHTML = `
                <span>${deviceNames[schedule.pin]} - ${schedule.time} (${actionText})</span>
                <button class="delete-btn" onclick="deleteSchedule(${index})">Xóa</button>
            `;
            scheduleList.appendChild(div);
        });
    }

    window.deleteSchedule = function(index) {
        schedules.splice(index, 1);
        localStorage.setItem('deviceSchedules', JSON.stringify(schedules));
        renderSchedules();
    };

    btnAddSchedule.onclick = () => {
        const device = scheduleDeviceSelect.value;
        const time = scheduleTimeInput.value;
        const action = scheduleActionSelect.value;
        
        if (!time) {
            alert('Vui lòng chọn giờ hẹn');
            return;
        }

        schedules.push({ pin: device, time, action });
        localStorage.setItem('deviceSchedules', JSON.stringify(schedules));
        scheduleTimeInput.value = '';
        renderSchedules();
    };

    // Check schedule mỗi phút
    function checkSchedules() {
        const now = new Date();
        const currentTime = now.getHours().toString().padStart(2, '0') + ':' + 
                           now.getMinutes().toString().padStart(2, '0');
        
        schedules.forEach(schedule => {
            if (schedule.time === currentTime) {
                const newState = schedule.action === 'on' ? 1 : 0;
                update(ref(db, 'control'), { [schedule.pin]: newState });
            }
        });
    }

    setInterval(checkSchedules, 5000); // Check mỗi 5 giây
    renderSchedules(); // Load schedule khi page load
</script>

</body>
</html>
