<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Light Switch</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='80'>💡</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; margin: 0; background-color: #121212; color: white; padding: 24px 16p[...]
        .card { background: #1e1e1e; padding: 24px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 740px; }

        /* Header */
        .card-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid #333; }
        .card-header h2 { margin: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
        #systemStatus { margin: 0; font-size: 0.95rem; }
        .clock-box { font-size: 1.2rem; font-weight: bold; color: #2196F3; background: #252525; padding: 6px 14px; border-radius: 8px; white-space: nowrap; }

        /* Device grid */
        .lights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .control-group { padding: 15px; border: 1px solid #333; border-radius: 10px; text-align: center; }
        .pump-group { margin-bottom: 14px; text-align: left; }
        .status { font-size: 1.1rem; font-weight: bold; margin: 8px 0; }
        .btn { width: 100%; padding: 11px; font-size: 0.95rem; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-on { background-color: #4caf50; color: white; }
        .btn-off { background-color: #f44336; color: white; }
        .label { color: #aaa; font-size: 0.9rem; margin-bottom: 4px; display: block; }

        /* Schedule */
        .schedule-group { padding: 16px; border: 1px solid #444; border-radius: 10px; background: #252525; }
        .schedule-title { color: #4caf50; font-weight: bold; margin-bottom: 12px; font-size: 1rem; }
        .schedule-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .schedule-form .span2 { grid-column: 1 / -1; }
        .time-input { width: 100%; padding: 8px; border: 1px solid #333; border-radius: 5px; background: #1a1a1a; color: white; font-size: 0.9rem; }
        .time-row { display: flex; align-items: center; gap: 6px; }
        .time-row .time-input { margin: 0; }
        .btn-schedule { width: 100%; padding: 10px; font-size: 0.9rem; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background-color: #2196F3; color: white; }
        .btn-schedule:hover { background-color: #1976D2; }
        .schedule-list { margin-top: 10px; text-align: left; font-size: 0.85rem; }
        .schedule-item { padding: 8px; margin: 5px 0; background: #1a1a1a; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .delete-btn { background: #f44336; padding: 4px 8px; border: none; border-radius: 3px; color: white; cursor: pointer; font-size: 0.8rem; flex-shrink: 0; }

        @media (max-width: 480px) {
            .lights-grid { grid-template-columns: 1fr; }
            .schedule-form { grid-template-columns: 1fr; }
            .card-header { flex-direction: column; align-items: flex-start; }
            .header-right { align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Header -->
    <div class="card-header">
        <h2><i class="fas fa-home"></i> Home Light Switch</h2>
        <div class="header-right">
            <p id="systemStatus" style="color: #4caf50;">● Đang kiểm tra...</p>
            <div class="clock-box"><i class="fas fa-clock"></i> <span id="realtimeClock">00:00:00</span></div>
        </div>
    </div>

    <!-- Lights: 2-column grid -->
    <div class="lights-grid">
        <div class="control-group">
            <span class="label"><i class="fas fa-lightbulb"></i> Main Light</span>
            <div id="statusPin2" class="status">Đang tải...</div>
            <button id="btnPin2" class="btn">Đang đợi...</button>
        </div>
        <div class="control-group">
            <span class="label"><i class="fas fa-lightbulb"></i> Balcony Light</span>
            <div id="statusPin3" class="status">Đang tải...</div>
            <button id="btnPin3" class="btn">Đang đợi...</button>
        </div>
    </div>

    <!-- Pump: full width -->
    <div class="control-group pump-group">
        <span class="label"><i class="fas fa-water"></i> Bơm Nước</span>
        <div id="statusPin10" class="status">Đang tải...</div>
        <div style="padding: 12px; background: #2a2a2a; border-radius: 8px; margin-top: 10px;">
            <button id="btnPin9" class="btn" style="margin-bottom: 12px;">Bật Bơm</button>
            <label for="speedSlider" style="color: #aaa; font-size: 0.9rem;">Tốc độ PWM (PIN 1):</label>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 8px;">
                <input type="range" id="speedSlider" min="0" max="255" value="0" style="flex: 1; cursor: pointer; accent-color: #2196F3;">
                <span id="speedValue" style="color: #4caf50; font-weight: bold; min-width: 42px;">0%</span>
            </div>
            <small style="color: #888; margin-top: 5px; display: block;">0 = Tắt | 255 = Tối đa</small>
        </div>
    </div>

    <!-- Schedule -->
    <div class="schedule-group">
        <div class="schedule-title"><i class="fas fa-calendar-clock"></i> Hẹn Giờ Bật/Tắt</div>
        <div class="schedule-form">
            <select id="scheduleDevice" class="time-input">
                <option value="pin2">Main Light</option>
                <option value="pin3">Balcony Light</option>
                <option value="pin9">Bơm Nước</option>
            </select>
            <select id="scheduleAction" class="time-input">
                <option value="on">Bật</option>
                <option value="off">Tắt</option>
            </select>
            <div class="time-row span2">
                <input type="time" id="scheduleTime" class="time-input" placeholder="Giờ:Phút">
                <span style="color: #aaa; font-weight: bold;">:</span>
                <input type="number" id="scheduleSeconds" class="time-input" placeholder="Giây" min="0" max="59" value="0" style="width: 80px;">
            </div>
            <button id="btnAddSchedule" class="btn-schedule span2">+ Thêm Hẹn Giờ</button>
        </div>
        <div id="scheduleList" class="schedule-list"></div>
    </div>

</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Cấu hình của bạn
    const firebaseConfig = {
        apiKey: "AIzaSyAnUXN6KPgZiRrNs4BGmWA6MRS6uejCuAs",
        authDomain: "enose-riwqcm.firebaseapp.com",
        databaseURL: "https://enose-riwqcm-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "enose-riwqcm",
        storageBucket: "enose-riwqcm.firebasestorage.app",
        messagingSenderId: "901661079604",
        appId: "1:901661079604:web:8e3aa428380b9aa7133261"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- CHECK STATUS ONLINE/OFFLINE ---
    const systemStatus = document.getElementById('systemStatus');
    const TIMEOUT = 60; // 60 giây
    let lastActive = 0;

    // Lắng nghe last_active từ database
    onValue(ref(db, 'control/last_active'), (snapshot) => {
        lastActive = snapshot.val();
        updateSystemStatus();
    });

    // Function check online/offline
    function updateSystemStatus() {
        const now = Math.floor(Date.now() / 1000);
        const timeDiff = now - lastActive;
        
        if (timeDiff < TIMEOUT) {
            systemStatus.innerText = "● System Online";
            systemStatus.style.color = "#4caf50";
        } else {
            systemStatus.innerText = "● System Offline";
            systemStatus.style.color = "#ff9800";
        }
    }

    // Poll mỗi 5 giây để check status
    setInterval(updateSystemStatus, 5000);

    // --- ĐỒNG HỒ REAL TIME ---
    const realtimeClock = document.getElementById('realtimeClock');
    function updateClock() {
        const now = new Date();
        const hours = now.getHours().toString().padStart(2, '0');
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        realtimeClock.innerText = `${hours}:${minutes}:${seconds}`;
    }
    updateClock(); // Update ngay lần đầu
    setInterval(updateClock, 1000); // Update mỗi 1 giây

    // --- XỬ LÝ PIN 2 ---
    const statusPin2 = document.getElementById('statusPin2');
    const btnPin2 = document.getElementById('btnPin2');
    let statePin2 = 0; // Lưu trạng thái hiện tại

    onValue(ref(db, 'control/pin2'), (snapshot) => {
        statePin2 = snapshot.val();
        statusPin2.innerText = statePin2 === 0 ? "ĐANG BẬT" : "ĐANG TẮT";
        statusPin2.style.color = statePin2 === 0 ? "#4caf50" : "#f44336";
        btnPin2.innerText = statePin2 === 0 ? "TẮT PIN 2" : "BẬT PIN 2";
        btnPin2.className = statePin2 === 0 ? "btn btn-off" : "btn btn-on";
    });

    btnPin2.onclick = () => {
        const newState = statePin2 === 0 ? 1 : 0;
        update(ref(db, 'control'), { pin2: newState });
    };

    // --- XỬ LÝ PIN 3 ---
    const statusPin3 = document.getElementById('statusPin3');
    const btnPin3 = document.getElementById('btnPin3');
    let statePin3 = 0;

    onValue(ref(db, 'control/pin3'), (snapshot) => {
        statePin3 = snapshot.val();
        statusPin3.innerText = statePin3 === 0 ? "ĐANG BẬT" : "ĐANG TẮT";
        statusPin3.style.color = statePin3 === 0 ? "#4caf50" : "#f44336";
        btnPin3.innerText = statePin3 === 0 ? "TẮT PIN 3" : "BẬT PIN 3";
        btnPin3.className = statePin3 === 0 ? "btn btn-off" : "btn btn-on";
    });

    btnPin3.onclick = () => {
        const newState = statePin3 === 0 ? 1 : 0;
        update(ref(db, 'control'), { pin3: newState });
    };

    // --- XỰ LÝ PIN 9 (ENABLE/DISABLE) VÀ PIN 1 (PWM SPEED) ---
    const statusPin10 = document.getElementById('statusPin10');
    const btnPin9 = document.getElementById('btnPin9');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    let statePin9 = 0; // Enable/Disable
    let statePin1 = 0; // PWM speed

    // Listen to PIN 9 (Enable/Disable)
    onValue(ref(db, 'control/pin9'), (snapshot) => {
        statePin9 = snapshot.val() || 0;
        updatePumpStatus();
        btnPin9.innerText = statePin9 === 0 ? "TẮT BƠM" : "BẬT BƠM";
        btnPin9.className = statePin9 === 0 ? "btn btn-off" : "btn btn-on";
    });

    // Listen to PIN 1 (PWM speed)
    onValue(ref(db, 'control/pin1_speed'), (snapshot) => {
        statePin1 = snapshot.val() || 0;
        speedSlider.value = statePin1;
        updateSpeedDisplay();
        updatePumpStatus();
    });

    // Update pump status display
    function updatePumpStatus() {
        if (statePin9 === 1) {
            statusPin10.innerText = "ĐANG TẮT";
            statusPin10.style.color = "#f44336";
        } else {
            const percentage = Math.round((statePin1 / 255) * 100);
            statusPin10.innerText = `ĐANG BẬT (${percentage}%)`;
            statusPin10.style.color = "#4caf50";
        }
    }

    // Update speed display
    function updateSpeedDisplay() {
        const percentage = Math.round((statePin1 / 255) * 100);
        speedValue.innerText = percentage + '%';
    }

    // Enable/Disable button click
    btnPin9.onclick = () => {
        const newState = statePin9 === 0 ? 1 : 0;
        update(ref(db, 'control'), { pin9: newState });
    };

    // PWM speed slider change
    speedSlider.oninput = () => {
        const pwmValue = parseInt(speedSlider.value);
        update(ref(db, 'control'), { pin1_speed: pwmValue });
    };

    // --- HẸN GIỜ BẬT/TẮT ---
    let schedules = {}; // Đồng bộ real-time từ Firebase
    const scheduleDeviceSelect = document.getElementById('scheduleDevice');
    const scheduleTimeInput = document.getElementById('scheduleTime');
    const scheduleSecondsInput = document.getElementById('scheduleSeconds');
    const scheduleActionSelect = document.getElementById('scheduleAction');
    const btnAddSchedule = document.getElementById('btnAddSchedule');
    const scheduleList = document.getElementById('scheduleList');

    const deviceNames = {
        'pin2': 'Main Light',
        'pin3': 'Balcony Light',
        'pin9': 'Bơm Nước'
    };

    function renderSchedules() {
        scheduleList.innerHTML = '';
        const entries = Object.entries(schedules);
        if (entries.length === 0) {
            scheduleList.innerHTML = '<div style="color:#666; text-align:center; padding:8px;">Chưa có hẹn giờ nào</div>';
            return;
        }
        entries.forEach(([key, schedule]) => {
            const div = document.createElement('div');
            div.className = 'schedule-item';
            const actionText = schedule.action === 'on' ? 'Bật' : 'Tắt';
            const secs = schedule.seconds !== undefined ? ':' + schedule.seconds.toString().padStart(2, '0') : '';
            div.innerHTML = `
                <span>${deviceNames[schedule.pin] ?? schedule.pin} — ${schedule.time}${secs} (${actionText})</span>
                <button class="delete-btn" onclick="deleteSchedule('${key}')">Xóa</button>
            `;
            scheduleList.appendChild(div);
        });
    }

    // Lắng nghe schedules từ Firebase — tự đồng bộ mọi thiết bị
    onValue(ref(db, 'schedules'), (snapshot) => {
        schedules = snapshot.val() || {};
        renderSchedules();
    });

    window.deleteSchedule = function(key) {
        remove(ref(db, 'schedules/' + key));
    };

    btnAddSchedule.onclick = () => {
        const device = scheduleDeviceSelect.value;
        const time = scheduleTimeInput.value;
        const seconds = parseInt(scheduleSecondsInput.value) || 0;
        const action = scheduleActionSelect.value;

        if (!time) {
            alert('Vui lòng chọn giờ hẹn');
            return;
        }

        push(ref(db, 'schedules'), { pin: device, time, seconds, action });
        scheduleTimeInput.value = '';
        scheduleSecondsInput.value = '0';
    };

    // Check schedule mỗi giây
    function checkSchedules() {
        const now = new Date();
        const currentTime = now.getHours().toString().padStart(2, '0') + ':' +
                            now.getMinutes().toString().padStart(2, '0');
        const currentSeconds = now.getSeconds();

        Object.values(schedules).forEach(schedule => {
            if (schedule.time === currentTime && schedule.seconds === currentSeconds) {
                let newState;
                if (schedule.pin === 'pin2' || schedule.pin === 'pin3') {
                    // Đèn dùng logic ngược: 0=BẬT, 1=TẮT
                    newState = schedule.action === 'on' ? 0 : 1;
                } else {
                    // Bơm (pin9): 0=BẬT, 1=TẮT (đã đảo logic)
                    newState = schedule.action === 'on' ? 0 : 1;
                }
                update(ref(db, 'control'), { [schedule.pin]: newState });
            }
        });
    }

    setInterval(checkSchedules, 1000); // Check mỗi 1 giây
</script>

</body>
</html>
